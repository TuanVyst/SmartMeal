[project]
name = "smartmeal-predict"
version = "0.1.0"
description = "SmartMeal ONNX CPU inference API using Flask"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "onnxruntime>=1.18.0",
    "numpy>=1.26.0,<2.0.0",
    "pillow>=10.0.0",
    "gunicorn>=22.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartmeal_predict"]
