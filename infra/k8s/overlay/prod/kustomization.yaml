apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smartmeal
images:
  - name: ghcr.io/tuanvyst/smartmeal/smartmeal-server
    newTag: latest
  - name: ghcr.io/tuanvyst/smartmeal/smartmeal-predict
    newTag: latest
resources:
  - network-policy.yaml
  - gateway.yaml
  - ../../base/api
  - ../../base/predict

patches:
  - path: deployment.yaml
  - path: routing.yaml