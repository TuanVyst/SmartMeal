on:
  push:
    branches: ["master"]

permissions:
  contents: read
  packages: write

jobs:
  api-build:
    name: Build source code to Docker image
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Develop
        uses: actions/checkout@v3

      - name: DockerHub Login
        uses: docker/login-action@v3.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: |
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            echo "REGISTRY=ghcr.io/$REPO_LOWER" >> $GITHUB_ENV

      - name: Build Image And Push
        uses: docker/build-push-action@v4
        with:
          context: Server
          file: Server/Dockerfile
          push: true
          tags: ${{env.REGISTRY}}/smartmeal-server:latest

  api-deploy:
    name: Deploy SmartMeal
    runs-on: self-hosted
    needs: api-build
    env:
      DB_USERNAME: ${{secrets.DB_USERNAME}}
      DB_PASSWORD: ${{secrets.DB_PASSWORD}}
      DB_NAME: ${{secrets.DB_NAME}}
      JWT_KEY: ${{secrets.JWT_KEY}}
      JWT_ISSUER: ${{secrets.JWT_ISSUER}}
      JWT_AUDIENCE: ${{secrets.JWT_AUDIENCE}}
      GOOGLE_CLIENTID: ${{secrets.GOOGLE_CLIENTID}}
      CLOUDFLARE_TUNNEL_TOKEN: ${{secrets.CLOUDFLARE_TUNNEL_TOKEN}}
      EMAIL_HOST: ${{secrets.EMAIL_HOST}}
      EMAIL_PORT: ${{secrets.EMAIL_PORT}}
      EMAIL_USER: ${{secrets.EMAIL_USER}}
      EMAIL_PASS: ${{secrets.EMAIL_PASS}}
      CLOUDINARY_CLOUD_NAME: ${{secrets.CLOUDINARY_CLOUD_NAME}}
      CLOUDINARY_API_KEY: ${{secrets.CLOUDINARY_API_KEY}}
      CLOUDINARY_API_SECRET: ${{secrets.CLOUDINARY_API_SECRET}}
      PAYOS_CLIENT_ID: ${{secrets.PAYOS_CLIENT_ID}}
      PAYOS_API_KEY: ${{secrets.PAYOS_API_KEY}}
      PAYOS_CHECKSUM_KEY: ${{secrets.PAYOS_CHECKSUM_KEY}}
      PAYOS_RETURN_URL: ${{secrets.PAYOS_RETURN_URL}}
      PAYOS_CANCEL_URL: ${{secrets.PAYOS_CANCEL_URL}}
    steps:
      - name: Checkout Develop
        uses: actions/checkout@v3
      - name: DockerHub Login
        uses: docker/login-action@v3.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase repository name
        run: |
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            echo "REGISTRY=ghcr.io/$REPO_LOWER" >> $GITHUB_ENV
      - name: Stop API
        run: docker compose -f .docker/compose.yaml -p smartmeal-application pull
        continue-on-error: true
      - name: Deploy API
        run: docker compose -f .docker/compose.yaml -p smartmeal-application up -d
      - name: Cleanup
        run: docker image prune -af
