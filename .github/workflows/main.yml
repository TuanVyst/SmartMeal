on:
  push:
    branches: ["master"]

permissions:
  contents: read
  packages: write

jobs:
  api-build:
    name: Build source code to Docker image
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Develop
        uses: actions/checkout@v3

      - name: DockerHub Login
        uses: docker/login-action@v3.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: |
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            echo "REGISTRY=ghcr.io/$REPO_LOWER" >> $GITHUB_ENV

      - name: Build Image And Push
        uses: docker/build-push-action@v4
        with:
          context: Server
          file: Server/Dockerfile
          push: true
          tags: ${{env.REGISTRY}}/smartmeal-server:latest

  ai-build:
    name: Build AI inference Docker image
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: DockerHub Login
        uses: docker/login-action@v3.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: |
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            echo "REGISTRY=ghcr.io/$REPO_LOWER" >> $GITHUB_ENV

      - name: Build and Push AI Image
        uses: docker/build-push-action@v4
        with:
          context: AI
          file: AI/Dockerfile
          push: true
          tags: ${{env.REGISTRY}}/smartmeal-predict:latest
